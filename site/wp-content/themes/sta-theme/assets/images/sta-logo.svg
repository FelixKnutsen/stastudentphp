<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 66" fill="none" width="100%" height="100%">
  <!-- Authentic STA logo for dark teal background: blends seamlessly with header -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- STA: Vibrant Brand Orange (#EF7330) -->
    <text x="0" y="50" font-size="52" font-weight="800" fill="#EF7330" letter-spacing="-0.5">STA</text>
    
    <!-- Studentorganisasjonen i Agder: Pure White (#FFFFFF) matching navigation links -->
    <text x="122" y="30" font-size="16.5" font-weight="600" fill="#FFFFFF" letter-spacing="-0.2">Studentorganisasjonen</text>
    <text x="122" y="52" font-size="16.5" font-weight="600" fill="#FFFFFF" letter-spacing="-0.2">i Agder</text>
  </g>
</svg>
